<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Screen resumes and shortlist candidates faster with AI-powered skill matching." />
    <meta name="theme-color" content="#1f2924" />
    <title>ShortlistAI – Resume Screening Workspace</title>
    <style>
      /* Critical CSS for initial paint */
      body { margin: 0; background: #f5f3ee; font-family: 'Manrope', -apple-system, sans-serif; }
      #root { min-height: 100vh; }
      .initial-loader { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .initial-loader-ring { width: 36px; height: 36px; border: 3px solid #e2e0d6; border-top-color: #2f6f5e; border-radius: 50%; animation: il-spin 0.8s linear infinite; }
      @keyframes il-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" aria-label="Loading application">
        <div class="initial-loader-ring"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
