services:
  - type: web
    name: resume-scanning-app
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix client run build && npm --prefix server install
    startCommand: NODE_ENV=production node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 5000

